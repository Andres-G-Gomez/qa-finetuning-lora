# Training Configuration for QA Fine-tuning with QLoRA

# Model Configuration
model:
  model_id: "gpt2"
  max_length: 256

# Data Configuration
data:
  data_dir: "./data/qa_pairs/"
  test_size: 0.3
  seed: 42

# LoRA Configuration
lora:
  r: 8
  lora_alpha: 16
  target_modules: ["c_attn"]
  lora_dropout: 0.2
  bias: "none"
  task_type: "CAUSAL_LM"

# Quantization Configuration (for CUDA)
quantization:
  load_in_4bit: true
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "auto"

# Training Arguments
training:
  output_dir: "./gpt2-qa-lora"
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 4
  num_train_epochs: 50
  learning_rate: 0.0003
  # lr_scheduler_type: "cosine"
  lr_scheduler_type: "constant"
  logging_steps: 10
  save_steps: 100
  eval_strategy: "steps" # Evaluate by steps, not epochs
  eval_steps: 50
  save_strategy: "steps" # Save by steps, not epochs
  logging_dir: "./logs"
  remove_unused_columns: true
  report_to: "none"
  dataloader_pin_memory: false
  gradient_checkpointing: true
  warmup_steps: 0
  warmup_ratio: 0.0
  weight_decay: 0.05
  save_total_limit: 3 # Keep only 3 best checkpoints
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  save_only_model: true # Save only model weights, not optimizer state
  max_grad_norm: 1.0
  gradient_accumulation_steps: 4
  early_stopping_patience: 10

# Data Collator
data_collator:
  mlm: false
  pad_to_multiple_of: 8

# Inference Configuration
inference:
  max_tokens: 100
  temperature: 0.7
  do_sample: true
